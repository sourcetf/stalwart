name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Add upstream and sync
        run: |
          git remote add upstream https://github.com/stalwartlabs/stalwart.git
          git fetch upstream
          git checkout main
          if git merge upstream/main --no-edit --no-commit; then
            echo "Merge succeeded"
          else
            echo "Merge has conflicts or needs resolution"
          fi
          git reset HEAD .github/workflows/ || true
          git checkout HEAD -- .github/workflows/
          git clean -fd .github/workflows/
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git add -A
          git commit -m "Sync upstream (exclude workflow changes)"
          git push origin main
